name: CI

# CI Foundation v2
# 目的：验证 Project Foundation / Governance 基线的真实可验证事实，
#       并运行第一批 deterministic tranche 的 Layer-1 loader 测试。
# 范围限制（有意为之）：
#   - Python 测试只使用标准库（unittest / stdlib）；不安装第三方依赖、不下载外部工具
#   - 无 network / database / LLM / secret / AI 调用
#   - 不做 lint / integration / eval（当前尚无对应可验证对象）
#   - 不使用 cache / artifact / service container / secret
# foundation-checks 语义保持不变；layer1-loader-tests 为本 tranche 的最小扩展。

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# 只读权限：本 workflow 不需要写入任何内容
permissions:
  contents: read

jobs:
  foundation-checks:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required project files exist
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "AGENTS.md"
            "CONTRIBUTING.md"
            ".gitignore"
            "docs/discovery/discovery-brief-v0.1.1.md"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ -f "$f" ]; then
              echo "OK      $f"
            else
              echo "::error title=Missing required file::$f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: No sensitive files are tracked
        run: |
          set -euo pipefail
          # 明确禁止进入版本控制的敏感文件模式（对 Git 已跟踪文件生效）。
          # 注意：.env.example 属于允许的模板文件，不作为 Secret 处理。
          sensitive_patterns=(
            '(^|/)\.env$'
            '(^|/)\.env\.'
            '\.pem$'
            '\.key$'
            '\.p12$'
            '\.pfx$'
            '(^|/)id_rsa$'
            '(^|/)id_ed25519$'
            '(^|/)id_ecdsa$'
            '\.ppk$'
            '(^|/)\.npmrc$'
            '(^|/)\.pypirc$'
            '(^|/)\.netrc$'
            '(^|/)credentials$'
            '(^|/)\.aws/'
          )
          tracked="$(git ls-files)"
          violations=""
          for pattern in "${sensitive_patterns[@]}"; do
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              # .env.example 是允许的模板文件，明确放行，避免被误判为 Secret
              case "$file" in
                *.env.example|.env.example) continue ;;
              esac
              violations="${violations}${file}"$'\n'
            done < <(printf '%s\n' "$tracked" | grep -E "$pattern" || true)
          done
          if [ -n "$violations" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              echo "::error title=Sensitive file is tracked::$line"
            done <<< "$violations"
            exit 1
          fi
          echo "OK      no sensitive files tracked"

      - name: Baseline is under version control
        run: |
          set -euo pipefail
          for f in "CONTRIBUTING.md" "docs/discovery/discovery-brief-v0.1.1.md"; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "OK      tracked: $f"
            else
              echo "::error title=Baseline file not tracked::$f"
              exit 1
            fi
          done

      - name: Sensitive file patterns remain gitignored
        run: |
          set -euo pipefail
          # 防止后续误删 .gitignore 中的敏感文件规则。
          for pattern in ".env" "*.pem" "*.key"; do
            if grep -qF -- "$pattern" .gitignore; then
              echo "OK      .gitignore covers: $pattern"
            else
              echo "::error title=gitignore rule missing::.gitignore no longer ignores: $pattern"
              exit 1
            fi
          done

  layer1-loader-tests:
    name: Layer-1 loader tests (SIMULATED)
    needs: foundation-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Confirm the standard-library-only boundary
        run: |
          set -euo pipefail
          python --version
          python - <<'PY'
          import importlib.util
          import sys

          third_party = [
              module
              for module in ("pytest", "pydantic", "requests", "numpy", "flask")
              if importlib.util.find_spec(module)
          ]
          print(f"third-party packages available: {third_party}")
          print(f"platform: {sys.platform}")
          PY

      - name: Run deterministic SIMULATED unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Verify the thin CLI entry point end to end
        run: |
          set -euo pipefail
          # CI-only scratch space: not part of the repository content.
          scratch="$(mktemp -d)"
          mkdir -p "$scratch/landing/pkg"
          python - "$scratch" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          scratch = pathlib.Path(sys.argv[1])
          package = scratch / "landing" / "pkg"
          records = [
              {
                  "plant_id": "P1",
                  "material_code": "M1",
                  "required_date": "2026-02-01",
                  "ProductionQty": "10",
                  "BOMComponentQty": "2",
              }
          ]
          payload = json.dumps(records, ensure_ascii=False, indent=2).encode("utf-8")
          (package / "requirement.json").write_bytes(payload)
          manifest = {
              "package": {
                  "snapshot_package_id": "SIMULATED-CI-PKG",
                  "contract_version": "v0.2",
                  "created_at": "2026-01-05T08:30:00Z",
                  "environment": "SIMULATED",
                  "evidence_classification": "SIMULATED",
                  "completeness_state": "COMPLETE",
              },
              "datasets": [
                  {
                      "role": "Production Requirement",
                      "artifact": "requirement.json",
                      "record_count": 1,
                      "provenance_ref": "simulated://ci/requirement",
                      "integrity_evidence": hashlib.sha256(payload).hexdigest(),
                  }
              ],
          }
          (package / "manifest.json").write_bytes(
              json.dumps(manifest, ensure_ascii=False, indent=2).encode("utf-8")
          )
          PY
          python -m snapshot_loader \
            --trusted-root "$scratch/landing" \
            --package "$scratch/landing/pkg" \
            --reverify
          echo "OK      controlled SIMULATED package accepted and re-verified"
          rm -rf "$scratch"
